<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>SYNDICATE</title>
    <script>
      // Run before first paint/load so the browser never restores a mid-page
      // scroll on reload: the Home hero intro expects a clean top and the
      // About ScrollTrigger measures its pin at mount, staying inert if the
      // page comes up half-scrolled. (A module script can race the restore.)
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
