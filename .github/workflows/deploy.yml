name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # rsync the build to the domain's document root over SSH. Absolute target
      # path — no FTP landing-dir guesswork. --delete keeps the server an exact
      # mirror of dist/; brevo-config.php lives one level ABOVE this path so it
      # is untouched. error_log is PHP's runtime log, kept.
      - name: Deploy over SSH (rsync)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -rlvz --delete \
            --exclude='error_log' \
            --exclude='.ftp-deploy-sync-state.json' \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./dist/ \
            u158221593@46.202.196.3:/home/u158221593/domains/syndicatejazz.com/public_html/
