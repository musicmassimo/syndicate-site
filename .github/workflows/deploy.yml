name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Uploads the contents of dist/ (which includes send-inquiry.php, copied
      # verbatim from public/) to Hostinger over FTP. Only .git* and
      # node_modules are excluded — every other file type, .php included, ships.
      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # The FTP account lands directly in the domain's document root, so
          # the build is uploaded there as-is. (If the hosting docroot is ever
          # repointed at a public_html/ subfolder, change this back to that.)
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
